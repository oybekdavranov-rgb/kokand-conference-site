<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-6">
  <div class="max-w-xl w-full p-8 rounded-2xl border border-white/10 bg-white/5">
    <h1 class="text-2xl font-bold">Edit page locked</h1>
    <p class="text-slate-400 mt-2">
      This server requires a token to access the editor.
    </p>
    <div class="mt-4 p-4 rounded-xl bg-slate-900 border border-white/10 text-sm">
      Open: <code>/edit?token=YOUR_TOKEN</code>
    </div>
    <a href="/" class="inline-flex mt-6 px-4 py-2 rounded-lg bg-white/10 hover:bg-white/15 border border-white/10">Back</a>
  </div>
</body>
</html>
